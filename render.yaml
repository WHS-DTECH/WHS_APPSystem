services:
  - type: web
    name: WHS_APPSystem
    runtime: docker
    plan: starter
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: WHS_APPSystem_db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_HOSTED_DOMAIN
        sync: false

databases:
  - name: WHS_APPSystem_db
    plan: starter
    databaseName: whs_appsystem
    user: whs_appsystem_user

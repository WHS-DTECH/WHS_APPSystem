<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin_styles.css">
    <style>
        body {
            font-family: 'Lexend', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .admin-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 1.5rem;
            align-items: start;
        }
        .main-column {
            min-width: 0;
        }
        .status-sidebar {
            position: sticky;
            top: 1rem;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e5e7eb;
            padding: 1rem;
        }
        .status-sidebar h2 {
            margin: 0 0 0.75rem 0;
            color: #1f2937;
            font-size: 1rem;
        }
        .status-updated {
            font-size: 0.8rem;
            color: #6b7280;
            margin-bottom: 0.9rem;
        }
        .status-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            background: #fbfdff;
        }
        .status-card h3 {
            margin: 0 0 0.45rem 0;
            font-size: 0.95rem;
            color: #1f2937;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.84rem;
            margin: 0.28rem 0;
            color: #374151;
        }
        .status-pill {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .pill-good {
            background: #dcfce7;
            color: #166534;
        }
        .pill-warn {
            background: #fef3c7;
            color: #92400e;
        }
        .pill-bad {
            background: #fee2e2;
            color: #991b1b;
        }
        .status-note {
            font-size: 0.78rem;
            color: #6b7280;
            line-height: 1.35;
            margin-top: 0.45rem;
        }
        h1 {
            color: #333;
            margin-bottom: 2rem;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .metric-card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .metric-card h3 {
            margin: 0 0 0.5rem 0;
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: 600;
            color: #2563eb;
            margin: 0.5rem 0;
        }
        .metric-subtext {
            font-size: 0.85rem;
            color: #999;
            margin-top: 0.5rem;
        }
        .savings-card {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        .savings-card .metric-value {
            color: #ecfdf5;
        }
        .warning-card {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: white;
        }
        .warning-card .metric-value {
            color: #fed7aa;
        }
        .cost-comparison {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .cost-comparison h2 {
            margin: 0 0 1.5rem 0;
            color: #333;
            font-size: 1.25rem;
        }
        .comparison-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .comparison-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .provider {
            display: flex;
            flex-direction: column;
        }
        .provider-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .provider-detail {
            font-size: 0.9rem;
            color: #666;
            margin: 0.25rem 0;
        }
        .provider-cost {
            font-size: 1.3rem;
            font-weight: 600;
            color: #2563eb;
            margin-top: 0.5rem;
        }
        .admin-links {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .admin-links h2 {
            margin: 0 0 1.5rem 0;
            color: #333;
            font-size: 1.25rem;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .admin-link {
            display: block;
            padding: 1rem;
            background: #f0f9ff;
            border: 1px solid #e0f2fe;
            border-radius: 6px;
            text-decoration: none;
            color: #0369a1;
            font-weight: 500;
            transition: all 0.2s;
        }
        .admin-link:hover {
            background: #e0f2fe;
            border-color: #0284c7;
        }
        .loading {
            color: #999;
            font-size: 0.9rem;
        }
        .error {
            color: #dc2626;
            font-size: 0.9rem;
        }
        @media (max-width: 1100px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
            .status-sidebar {
                position: static;
                order: -1;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-include"></div>
    <script src="shared/navbar_loader.js"></script>

    <div class="container">
        <h1>Admin Dashboard</h1>
        <div class="admin-layout">
            <div class="main-column">

        <div class="admin-links">
            <h2>Admin Tools</h2>
            <div class="links-grid">
                <a href="admin_user_roles.html" class="admin-link">👥 User Roles</a>
                <a href="admin_department.html" class="admin-link">🏢 Department</a>
                <a href="admin_assessment_management.html" class="admin-link">&#128209; Assessment Management</a>
                <a href="admin_aisle_category.html" class="admin-link">📦 Aisle Categories</a>
                <a href="admin_food_brands.html" class="admin-link">🏷️ Food Brands</a>
                <a href="admin_aisle_keywords.html" class="admin-link">🔑 Aisle Keywords</a>
                <a href="admin_match_recipes.html" class="admin-link">📋 Match Recipes</a>
                <a href="admin_prefill_planner.html" class="admin-link">📅 Prefill Planner</a>
            </div>
        </div>

            </div>

        </div>
    </div>

</body>
</html>
